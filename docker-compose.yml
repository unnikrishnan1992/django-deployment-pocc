version: "3.9"

services:

  web:
    build: .
    container_name: django-demo

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:17

    container_name: postgres-db

    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password

    ports:
      - "5432:5432"